name: 'CI: Lint, Test & Build'

on:
  push:
    branches: [main]
    paths: ['server/**', 'frontend/**', 'frontend-fs.go', 'go.mod', 'go.sum', 'makefile', '.dev/**', 'deploy/**', '.github/workflows/ci.yaml']
  pull_request:
    branches: [main]
    paths: ['server/**', 'frontend/**', 'frontend-fs.go', 'go.mod', 'go.sum', 'makefile', '.dev/**', 'deploy/**', '.github/workflows/ci.yaml']

jobs:
  ci-job:
    name: Lint, Test & Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.3.1'

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Validate Helm chart
        run: make test-chart

      - name: Run build
        run: make build
